spring.application.name=didarova-medina-student-api
server.port=${SERVER_PORT:8080}

# Individual data
app.student.name=Didarova Medina
app.student.id=37944
app.student.group=IT2-2313
app.version=${APP_VERSION:v1.0-didarova-medina-37944}

# Database: values come from environment variables (docker-compose / .env).
# Defaults are only for running locally.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/didarova_students}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:didarova}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
