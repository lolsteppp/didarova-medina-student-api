# Local Jenkins for didarova-medina-student-api
# Start:  docker compose -f jenkins/docker-compose.yml up -d --build
# Open:   http://localhost:8081
# First admin password:
#   docker exec didarova-medina-jenkins cat /var/jenkins_home/secrets/initialAdminPassword
name: didarova-medina-jenkins

services:
  jenkins:
    build: .
    container_name: didarova-medina-jenkins
    user: root            # needed to use the mounted Docker socket (lab setup only)
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - didarova_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  didarova_jenkins_home:
    name: didarova_medina_jenkins_home
